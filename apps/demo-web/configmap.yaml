apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-web-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pl">
    <head>
      <meta charset="utf-8">
      <title>DPSS Lab - GitOps demo</title>
      <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #e6edf3;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { text-align: center; max-width: 640px; padding: 48px; }
        h1 { color: #58a6ff; font-size: 2.2em; margin-bottom: 8px; }
        .tag { color: #8b949e; margin-bottom: 32px; }
        .badge { display: inline-block; background: #238636; color: #fff; border-radius: 6px;
                 padding: 6px 14px; margin: 4px; font-size: .9em; }
        .row { margin-top: 24px; }
      </style>
    </head>
    <body>
      <div class="box">
        <h1>DPSS Lab</h1>
        <p class="tag">Awaryjny rescue / provisioning / klastry - GitOps w praktyce</p>
        <div>
          <span class="badge">k3s</span>
          <span class="badge">ArgoCD</span>
          <span class="badge">ZFS RAIDZ</span>
          <span class="badge">Proxmox VE</span>
        </div>
        <div class="row">
          <p>Ta strona jest serwowana z repo Git i synchronizowana automatycznie.<br>
          Zmiana manifestu = zmiana w klastrze. Bez ręcznych - test <code>kubectl apply</code>.</p>
        </div>
      </div>
    </body>
    </html>
